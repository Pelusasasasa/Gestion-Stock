<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/global.css">
    <link rel="stylesheet" href="./cuentas.css">
    <title>Cuentas</title>
</head>
<body class="h-calc-100vh-10px">
    <section class="seccionCuentas h-full">
        <main class="cuentas">
            <div>
                <label for="cuentas">Cuentas</label>
                <input type="text" disabled name="cuentas" id="cuentas">
            </div>
            <button id="agregar">
                <i class="bi bi-plus-circle" style="color: #000"></i>
            </button>
            <button id="borrar">
                <i class="bi bi-dash-circle" style="color: #000"></i>
            </button>
        </main>
        <main>
            <button id="prev">
                <i class="bi bi-arrow-left" style="color: #000"></i>
                Anterior
            </button>
            <button id="next">
                Siguiente
                <i class="bi bi-arrow-right" style="color: #000"></i>
            </button>
        </main>
    </section>
</body>

<script src="./cuentas.js"></script>
</html>
