<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Servicio</title>
    <link rel="stylesheet" href="../assets/global.css">
    <link href="../../node_modules/material-icons/iconfont/material-icons.css" rel="stylesheet">
</head>
<body class="m-0 p-0  h-screen bg-gray-50 bg-orange-700">
    
    <header class="flex justify-between bg-white b px-2 pt-2 w-full border-b border-gray-200">
        <div>
            <h1 class="m-0">Nuevo Servicio Tecnico</h1>
            <p class="m-0">Ingreso de nuevo servicio tecnico</p>
        </div>

        <div>
            <div class="flex gap-2">
                <button id="cancelar" class="flex items-center gap-2">
                    <i class="bi bi-x-lg"></i>
                    <p class="m-0">Cancelar</p>
                </button>

                <button class="flex items-center gap-2 bg-green-600 text-white" id="guardar">
                    <i class="bi bi-floppy"></i>
                    <p class="m-0">Guardar Servicio</p>
                </button>

                <button class="flex items-center gap-2 bg-green-600 text-white none" id="modificar">
                    <i class="bi bi-floppy"></i>
                    <p class="m-0">Modificar Servicio</p>
                </button>
            </div>
        </div>
    </header>

    <section class=" w-full mt-2 ">
        <form action="" class="mx-auto flex flex-col gap-2 max-w-7xl" >

            <div class="bg-gray-100 border rounded-sm border-gray-200 p-2">
                <h3>Datos del servicio</h3>
                <div class="flex gap-2 justify-around">
                    <div class="flex flex-col">
                        <label for="numero">Numero Del Servicio</label>
                        <input type="text" name="numero" id="numero" disabled class="border rounded-sm">
                    </div>
                    <div class="flex flex-col">
                        <label for="fecha">Fecha</label>
                        <input type="date" name="fecha" id="fecha" class="border rounded-sm">
                    </div>
                </div>
            </div>

            <div class="bg-gray-100 border rounded-sm border-gray-200 p-2">
                <h3 class="text-xl m-0 mb-2">Cliente</h3>

                <div class="flex flex-col">
                    <label for="cliente" class="font-bold mb-2">Buscar Cliente *</label>
                    <input type="text" name="cliente" id="cliente" class="border border-gray-200 rounded-sm" placeholder="Buscar por codigo o nombre">
                </div>

                <div class="flex justify-around mt-2">
                    <div class="flex flex-col">
                        <label for="direccion" class="font-bold mb-2">Direccion</label>
                        <input type="text" name="direccion" id="direccion" class="border border-gray-200 rounded-sm" disabled>
                    </div>

                    <div class="flex flex-col">
                        <label for="telefono" class="font-bold mb-2">Telefono</label>
                        <input type="text" name="telefono" id="telefono" class="border border-gray-200 rounded-sm" disabled>
                    </div>
                </div>

                <div class="none mt-2 border border-gray-200 h-20 rounded-sm overflow-scroll">
                    <div class="flex justify-between border-b border-gray-200">
                        <p class="text-gray-700 m-0">Nombre</p>
                        <p class="text-gray-700 m-0">Direccion</p>
                        <p class="text-gray-700 m-0">Telefono</p>
                    </div>
                    <div id="listaClientes" >
                        
                    </div>
                </div>
            </div>

            <div class="bg-gray-100 border rounded-sm border-gray-200 p-2">
                <h3>Productos</h3>

                <div class="flex flex-col">
                    <label for="producto" class="font-bold mb-2">Buscar Producto *</label>
                    <input type="text" name="producto" id="producto" placeholder="Buscar por codigo o nombre" class="border border-gray-200 rounded-sm">
                </div>
                <div class="mt-2 border none border-gray-200 h-20 rounded-sm overflow-scroll">
                    <div class="columns-3-1fr-2fr-1fr grid border-b border-gray-200">
                        <p class="text-gray-700 m-0">Codigo</p>
                        <p class="text-gray-700 m-0">Descripcion</p>
                        <p class="text-gray-700 m-0">Marca</p>
                    </div>
                    <div id="listaProductos">
                
                    </div>
                </div>

                <div class="mt-2 px-1 border border-gray-200 h-20 rounded-sm overflow-auto">
                    <h3>Productos Agregados</h3>
                    <div class="flex flex-col gap-2 border-b border-gray-200" id="productosAgregados">
                        
                    </div>
                </div>
            </div>

            <div class="bg-gray-100 border rounded-sm border-gray-200 p-2">
                <h3>Observaciones generales</h3>
                <div class="flex">
                    <textarea class="w-full border-gray-200 border rounded-sm p-1" rows="5" name="sugerencia" id="sugerencia"></textarea>
                </div>
            </div>

            <div class="bg-gray-100 border rounded-sm border-gray-200 p-2 h-20 mb-2 overflow-scroll">
                <table class="w-full border-collapse">
                    <thead>
                        <tr>
                            <th class="border">Fecha</th>
                            <th class="border">Equipo</th>
                            <th class="border">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </form>
    </section>
    <script src="./agregarServicio.js"></script>
</body>
</html>
