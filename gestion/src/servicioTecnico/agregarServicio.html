<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Servicio</title>
    <link rel="stylesheet" href="../assets/global.css">
    <link href="../../node_modules/material-icons/iconfont/material-icons.css" rel="stylesheet">
</head>
<body class="m-0 p-0">
    
    <header class="flex justify-between bg-white px-2 pt-2 w-full  ">
        <div>
            <h1 class="m-0">Nuevo Servicio Tecnico</h1>
            <p class="m-0">Ingreso de nuevo servicio tecnico</p>
        </div>

        <div>
            <div class="flex gap-2">
                <button class="flex items-center gap-2">
                    <i class="bi bi-x-lg"></i>
                    <p class="m-0">Cancelar</p>
                </button>

                <button class="flex items-center gap-2 bg-green-600 text-white">
                    <i class="bi bi-floppy"></i>
                    <p class="m-0">Guardar Servicio</p>
                </button>
            </div>
        </div>
    </header>

    <section class="flex justify-center bg-gray-50">
        <form action="" class="w-full">
            <div>
                <h3>Datos del servicio</h3>
                <div class="flex flex-col">
                    <label for="numero">Numero</label>
                    <input type="text" name="numero" id="numero" disabled class="border rounded-sm">
                </div>


            </div>
        </form>
    </section>
    <script src="./agregarServicio.js"></script>
</body>
</html>
