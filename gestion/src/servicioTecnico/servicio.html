<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio Tecnico</title>
    <link rel="stylesheet" href="../assets/global.css">
    <link rel="stylesheet" href="./servicio.css">
    <link href="../../node_modules/material-icons/iconfont/material-icons.css" rel="stylesheet">
</head>
<body class="listaServicio">
    
    <header class="flex justify-between">
        <h1>Servicio Tecnico</h1>

        <div class="flex gap-2 items-center">
            <button class="flex items-center gap-2" id="imprimir">
                <i class="bi bi-printer" style="font-weight: bold;"></i>
                <p class="m-0 text-bold">Imprimir</p>
            </button>
            <button class="text-white bg-green-600 flex items-center gap-2" id="agregar">
                <i class="bi bi-plus-lg"></i>
                <p class="m-0">Nuevo Servicio</p>
            </button>
        </div>
    </header>

    <section class="mb-2 flex gap-2 items-center">
        <div class="w-50">
            <input class="border w-full rounded-sm px-2 py-1" type="text" name="buscador" placeholder="Buscar por cliente, equipo" id="buscador" >
        </div>

        <div>
            <p> <span id="cantidad"></span> Servicios encontrados</p>
        </div>
    </section>

    <section class="table">
        <table>
            <thead>
                <tr>
                    <th>N°</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Direccion</th>
                    <th>Telefono</th>
                    <th>Equipo</th>
                    <th>Estado</th>
                    <th>Vendedor</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </section>
    <script src="./servicio.js"></script>
</body>
</html>
