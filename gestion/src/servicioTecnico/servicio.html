<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio Tecnico</title>
    <link rel="stylesheet" href="../assets/global.css">
    <link rel="stylesheet" href="./servicio.css">
    <link href="../../node_modules/material-icons/iconfont/material-icons.css" rel="stylesheet">
</head>
<body class="listaServicio">
    
    <header class="flex justify-between">
        <h1>Servicio Tecnico</h1>

        <div class="flex gap-2 items-center">
            <button class="flex items-center gap-2">
                <i class="bi bi-printer" style="font-weight: bold;"></i>
                <p class="m-0 text-bold">Imprimir</p>
            </button>
            <button class="text-white bg-green-600 flex items-center gap-2">
                <i class="bi bi-plus-lg"></i>
                <p class="m-0">Nuevo Servicio</p>
            </button>
        </div>
    </header>

    <section class="table">
        <table>
            <thead>
                <tr>
                    <th>N°</th>
                    <th>Fecha Ingreso</th>
                    <th>Cliente</th>
                    <th>Telefono</th>
                    <th>Direccion</th>
                    <th>Producto</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Fecha Egreso</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
    <script src="./servicio.js"></script>
</body>
</html>
