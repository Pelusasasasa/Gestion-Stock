<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remitos</title>
    <link rel="stylesheet" href="../assets/global.css">
    <link href="../../node_modules/material-icons/iconfont/material-icons.css" rel="stylesheet">
</head>
<body class="m-0 p-0">
    <section class="flex items-center mt-1 justify-around gap-5">
        <div>
            <button id="volver">
                <i class="bi bi-arrow-left" style="color: #ca8a04"></i>
                Volver
            </button>
        </div>

        <div class="buscador flex flex-col  w-80 items-center mb-2">
            <label for="buscador text-center">Buscador</label>
            <input type="text" name="buscador" class="w-full" id="buscador">
        </div>
        <div class="flex flex-col gap-1">
            <label for="remitoC">Remitos Cancelados</label>
            <input type="checkbox"  name="remitoC" id="remitoC" class="scale-1-5 cursor-pointer">
        </div>
        
    </section>

    <section id="listRem" class="h-80vh mx-2 overflow-scroll bg-white">
        <table class="w-full border-collapse">
            <thead>
                <tr>
                    <th class="border">Fecha</th>
                    <th class="border">CodCliente</th>
                    <th class="border">Cliente</th>
                    <th class="border">Numero</th>
                    <th class="border">Observaciones</th>
                    <th class="border">CTA. CTE.</th>
                    <th class="border">Re Impresion</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </section>

    <section id="listMov" class="h-40vh mt-1 overflow-scroll bg-white none">
        <table class="w-full border-collapse">
            <thead>
                <tr>
                    <th class="border">Cod. Prod.</th>
                    <th class="border">Descripcion</th>
                    <th class="border">Marca</th>
                    <th class="border">Precio</th>
                    <th class="border">Cantidad</th>
                    <th class="border">PrecioTotal</th>
                    <th class="border">N° Serie</th>
                </tr>
            </thead>
            <tbody id="tbodyMov"></tbody>
        </table>
    </section>

    <section class="botones">
        <button id="pasarCTA">Pasar a CTA. CTE</button>
    </section>

    <!-- Modal Observaciones -->
     <div id="modal" class="absolute none top-0 bg-opacity-80 flex items-center justify-center h-screen w-full">
            <main class="bg-white p-2 rounded-sm">
                <div class="flex justify-between mx-2 gap-5  items-center">
                    <h4 class="text-black text-xl font-bold m-0">Cambiar Observaciones</h4>
                    <span class="font-bold text-xl cursor-pointer cerrarModal">x</span>
                </div>
                <div class="flex flex-col mt-1">
                    <label for="cambiarObservaciones" class="font-bold">Observaciones</label>
                    <input type="text" name="cambiarObservaciones" id="cambiarObservaciones">
                </div>
                <div class="flex justify-between mt-2">
                    <Button class="border border-gray-400 rounded-sm bg-green-600 text-white" id="aceptarCambioObservaciones">Aceptar</Button>
                    <Button class="border border-gray-400 rounded-sm cerrarModal">Cancelar</Button>
                </div>
            </main>
     </div>
</body>
<script src="./remitos.js"></script>
</html>
