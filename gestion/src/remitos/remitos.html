<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remitos</title>
    
    <link rel="stylesheet" href="./remito.css">
    <link href="../../node_modules/material-icons/iconfont/material-icons.css" rel="stylesheet">
</head>
<body id="remitos" class="m-0 p-0">
    <header id="header" class="flex items-center justify-around gap-5">
        <div id="title">
            <button id="volver">
                <span class="material-icons">arrow_back</span>
                <span>Volver</span>
            </button>
            <h3>Remitos</h3>
        </div>

        <div id="buscadorContainer" class="buscador flex items-center mb-2">
            <div id="buscadorInput">
                <input type="text" name="buscador" placeholder="Buscar por cliente..." class="w-full" id="buscador">
            </div>

            <div id="remitoC" class="flex  gap-1">
                <input type="checkbox"  name="remitoC" id="remitoC" class="scale-1-5 cursor-pointer">
                <label for="remitoC">Ver Cancelados</label>
            </div>
        </div>

        <div  id="pasarCTA">
            <span class="material-icons">description</span>
            <button>Pasar a CTA. CTE</button>
        </div>
        
    </header>


    <main id="main">
        
            <section id="listRem">
            </section>
        
        
        
            <section id="listMov">
                
            </section>

    </main>

  

    <!-- Modal Observaciones -->
     <div id="modal" class="none">
            <main class="bg-white p-2 rounded-sm">
                <div class="flex justify-between mx-2 gap-5  items-center">
                    <h4 class="text-black text-xl font-bold m-0">Cambiar Observaciones</h4>
                    <span class="font-bold text-xl cursor-pointer cerrarModal">x</span>
                </div>
                <div class="flex flex-col mt-1">
                    <label for="cambiarObservaciones" class="font-bold">Observaciones</label>
                    <input type="text" name="cambiarObservaciones" id="cambiarObservaciones">
                </div>
                <div class="flex justify-between mt-2">
                    <Button class="border border-gray-400 rounded-sm bg-green-600 text-white" id="aceptarCambioObservaciones">Aceptar</Button>
                    <Button class="border border-gray-400 rounded-sm cerrarModal">Cancelar</Button>
                </div>
            </main>
     </div>


</body>
<script src="./remitos.js"></script>
</html>
