<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="stylesheet" href="../assets/global.css">
    <link rel="stylesheet" href="./productos.css">
    <link href="../../node_modules/material-icons/iconfont/material-icons.css" rel="stylesheet">
</head>
<body class="productos m-0 p-0">
        <div class="buscador">
            <fieldset>
                <legend>Buscador</legend>

                <div class="caja" id="select">
                    <label for="seleccion">Seleccion</label>
                    <select name="seleccion" id="seleccion">
                        <option value="codigo">Codigo</option> 
                        <option selected value="descripcion">Descripcion</option>
                        <option value="marca">Marca</option>
                        <option value="rubro">Rubro</option>
                    </select>
                </div>
                <div class="caja" id="input">
                    <label for="buscador">Buscar Producto</label>
                    <input type="text" name="buscarProducto" autofocus id="buscarProducto">
                </div>
                <div>
                    <p>Apretar Enter para buscar</p>
                </div>
            </fieldset>
        </div>
        <div class="tabla">
            <table>
                <thead>
                    <tr>
                        <th>Codigo</th>
                        <th>Descripcion</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Marca</th>
                        <th>Rubro</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>


        <div id="historicaMovDiv" class="bg-opacity-80 left-0 top-0 h-screen absolute w-full none">
            <div id="cerrarMovLista" class="flex justify-end mr-5 top-10 mt-5 cursor-pointer">
                <i class="bi bi-x-lg text-white" style="font-size: 3rem;"></i>
            </div>
            <div class="w-calc-100vw-45px top-10 absolute bg-white h-60 border overflow-scroll mx-2">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Cod. Cliente</th>
                            <th>Cliente</th>
                            <th>Tipo Comp.</th>
                            <th>Cantidad</th>
                            <th>Egreso</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="historicaMovTable">

                    </tbody>
                </table>
            </div>
        </div>

        <section class="botones">
            <button class="agregar">Agregar Producto</button>
            <button class="ingresarMov">Ingresar Movimiento</button>
            <button class="salir">Salir</button>
        </section>
</body>
<script src="./productos.js" defer></script>
</html>
