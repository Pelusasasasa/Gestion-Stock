<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <link rel="stylesheet" href="../assets/global.css">
    <link rel="stylesheet" href="productos.css">
</head>
<body class="modificarProducto">
        <section id="titulo">
            <h1>Modificar Producto</h1>
        <main class="mr-2">
            <label for="dolarInstalador">Dolar Instalador</label>
            <input type="text" disabled class="text-rigth" name="dolarInstalador" id="dolarInstalador">
        </main>
        
        <main>
            <label for="dolar">Dolar Normal</label>
            <input type="text" disabled class="text-rigth" name="dolar" id="dolar">
        </main>
        </section>

        <fieldset>
            <legend>Identificador</legend>
            <section class="identificador">
                <div class="input">
                    <label for="codigo">Codigo</label>
                    <input type="text" disabled name="codigo" id="codigo">
                </div>
        
                <div class="input descripcion">
                    <label for="descripcion">Descripcion *</label>
                    <input type="text" name="descripcion" id="descripcion">
                </div>

                <div class="input codigoSecundario">
                    <label for="codigoSecundario">Codigo Secundario</label>
                    <input type="text" name="codigoSecundario" id="codigoSecundario">
                </div>
            </section>
        </fieldset>

        <fieldset>
            <legend>Informacion</legend>
            <section class="informacion">
                <div class="input">
                    <label for="unidad">Unidad</label>
                    <select name="unidad" id="unidad">
                        <option value="unidad">UNIDAD</option>
                        <option value="metros">METROS</option>
                        <option value="horas">HORAS</option>
                        <option value="KG">KG</option>
                    </select>
                </div>
                <div class="input">
                    <label for="marca">Marca</label>
                    <select name="marca" id="marca"></select>
                </div>
                <div class="input">
                    <label for="rubro">Rubro</label>
                    <select name="rubro" id="rubro">
                        <option value="0">--- SELECCIONAR ---</option>
                    </select>
                </div>
                <div class="input">
                    <label for="provedor">Provedor</label>
                    <select name="provedor" id="provedor"></select>
                </div>
                <div class="input">
                    <label for="stock">Stock *</label>
                    <input type="text" name="stock" id="stock">
                </div>
            </section>
        </fieldset>

        <fieldset>
            <legend>Precios</legend>
            <section class="precios">

                <div class="input">
                    <label for="costo">Costo *</label>
                    <input type="text" name="costo" id="costo"> 
                </div>

                <div class="input">
                    <label for="costoDolar">Costo Dolar *</label>
                    <input type="text" name="costoDolar" id="costoDolar"> 
                </div>

                <div class="input">
                    <label for="utilidad">Utilidad</label>
                    <input type="text" value="0.00" name="utilidad" id="utilidad"> 
                </div>
                <div class="input">
                    <label for="costoUtilidad">Costo + Utilidad</label>
                    <input type="text" disabled value="0.00" name="costoUtilidad" id="costoUtilidad"> 
                </div>

                <div class="input">
                    <label for="impuesto">Impuesto%</label>
                    <input type="text" name="impuesto" id="impuesto"> 
                </div>
            </section>
        </fieldset>

        <div class="flex w-full justify-around">
            <fieldset class="w-full">
                <legend>Precio Instalador</legend>
                <section class="precios">
            
                    <div class="input">
                        <label for="costoIvaInstalador">Costo + Iva (Instalador)</label>
                        <input type="number" class="text-rigth" disabled name="costoIvaInstalador" id="costoIvaInstalador">
                    </div>
                </section>
            </fieldset>
        </div>
        
        <fieldset>
            <legend>Precio Consumidor Final</legend>
            <section class="total">
                <div class="input">
                    <label for="ganancia">Ganancia% *</label>
                    <input type="text" name="ganancia" id="ganancia"> 
                </div>
                <div class="input">
                    <label for="total">Total *</label>
                    <input type="text" name="total" id="total"> 
                </div>
            </section>
        </fieldset>
        
        <main class="botones">
            <button id="modificar" class="modificar">Modificar Producto</button>
            <button id="comun" class="salir">Salir</button>
        </main>

        <section class="aclaracion">
            <h3>Los Campos que tengan el * tienen que se obligatorios, los costos pueden contener el valor 0</h3>
        </section>
</body>
<script src="./modificarProducto.js"></script>
</html>
